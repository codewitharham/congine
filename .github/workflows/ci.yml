name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Default Python for non-matrix jobs (setup/install/build/e2e/etc.).
  # Test/lint/typecheck jobs prove the >=3.10 floor via a matrix below.
  PYTHON_VERSION: '3.13'
  NX_CLOUD_DISTRIBUTED_EXECUTION: true
  NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT: 3

jobs:
  # Job 1: Setup and Validation
  setup:
    name: Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      node-cache-key: ${{ steps.node-cache.outputs.cache-key }}
      python-cache-key: ${{ steps.python-cache.outputs.cache-key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install UV package manager
        run: pip install uv

      - name: Validate Node.js environment
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Validate Python environment
        run: |
          echo "Python version: $(python --version)"
          echo "UV version: $(uv --version)"

      - name: Cache keys
        id: node-cache
        run: echo "cache-key=node-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

      - id: python-cache
        run: echo "cache-key=python-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}" >> $GITHUB_OUTPUT

  # Job 2: Install Dependencies
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Nx installation
        run: npx nx --version

      - name: Install Python workspace dependencies
        run: uv sync --all-extras

  # Job 3: Format Check
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Check code formatting
        run: npx nx record -- npx nx format:check --base="remotes/origin/main" || npx nx record -- npx nx format:check

      - name: Report formatting issues
        if: failure()
        run: |
          echo "❌ Code formatting issues detected"
          echo "Run 'npx nx format:write' locally to fix"

  # Job 4: Linting (Python version matrix — proves the >=3.10 floor)
  lint:
    name: Lint (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run linters
        run: npx nx record -- npx nx run-many -t lint --base="remotes/origin/main" || npx nx record -- npx nx run-many -t lint

      - name: Report linting issues
        if: failure()
        run: echo "❌ Linting failed on Python ${{ matrix.python-version }}. Fix the issues above."

  # Job 5: Type Checking (Python version matrix)
  typecheck:
    name: Type Check (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run type checking
        run: npx nx record -- npx nx run-many -t typecheck --base="remotes/origin/main" || npx nx record -- npx nx run-many -t typecheck

      - name: Report type checking issues
        if: failure()
        run: echo "❌ Type checking failed on Python ${{ matrix.python-version }}. Fix the issues above."

  # Job 6: Unit Tests (Python version matrix — proves the >=3.10 floor)
  test:
    name: Test (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run tests
        run: npx nx record -- npx nx run-many -t test --base="remotes/origin/main" || npx nx record -- npx nx run-many -t test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-py${{ matrix.python-version }}
          path: |
            coverage/
            .coverage
          retention-days: 30

      - name: Report test results
        if: failure()
        run: echo "❌ Tests failed on Python ${{ matrix.python-version }}. Check the logs above for details."

  # Job 7: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run build
        run: npx nx record -- npx nx run-many -t build --base="remotes/origin/main" || npx nx record -- npx nx run-many -t build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            build/
          retention-days: 7

      - name: Report build issues
        if: failure()
        run: echo "❌ Build failed. Check the logs above for details."

  # Job 8: E2E Tests (if applicable)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run E2E tests
        run: npx nx record -- npx nx run-many -t e2e-ci --base="remotes/origin/main" || npx nx record -- npx nx run-many -t e2e-ci || echo "No E2E tests configured"

      - name: Report E2E results
        if: failure()
        run: echo "⚠️ E2E tests failed or not configured"

  # Job 9: Nx Cloud Sync TypeScript References
  sync-typescript-refs:
    name: Sync TypeScript References
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync TypeScript project references
        run: npx nx sync:check

      - name: Report sync issues
        if: failure()
        run: |
          echo "❌ TypeScript project references are out of sync"
          echo "Run 'npx nx sync' locally to fix"

  # Job 10: Coverage Report
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-reports-py*
          merge-multiple: true

      - name: Display coverage summary
        run: |
          echo "📊 Code Coverage Summary"
          if [ -f .coverage ]; then
            echo "Coverage file found. Generate report with: coverage report"
          else
            echo "No coverage data available"
          fi

  # Job 11: Self-Healing CI (run after all tests)
  self-healing-ci:
    name: Self-Healing CI
    runs-on: ubuntu-latest
    needs: [format-check, lint, typecheck, test, build]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run Nx self-healing fixes
        run: npx nx fix-ci || true
        continue-on-error: true

      - name: Report self-healing attempts
        run: echo "✨ Nx self-healing CI attempted. Review changes above."

  # Job 12: Status Check & Summary
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [setup, install-dependencies, format-check, lint, typecheck, test, build, sync-typescript-refs, coverage, self-healing-ci]
    if: always()
    steps:
      - name: Check overall status
        run: |
          echo "🔍 CI Pipeline Summary"
          echo "========================"
          echo "Setup: ${{ needs.setup.result }}"
          echo "Install Dependencies: ${{ needs.install-dependencies.result }}"
          echo "Format Check: ${{ needs.format-check.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "TypeScript Sync: ${{ needs.sync-typescript-refs.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Self-Healing: ${{ needs.self-healing-ci.result }}"
          echo "========================"

      - name: Determine final status
        run: |
          if [[ "${{ needs.format-check.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline FAILED"
            exit 1
          else
            echo "✅ CI Pipeline PASSED"
          fi