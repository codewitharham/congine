name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.14'
  PYTHON_MIN_VERSION: '3.10'
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python

jobs:
  # Job 1: Repository Validation & Environment Setup
  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Environment
        run: |
          echo "🚀 Node version: $(node --version)"
          echo "📦 NPM version: $(npm --version)"
          echo "🐍 Python version: $(python --version)"
          echo "⚡ UV version: $(uv --version)"
          echo "✅ Environment validation passed"

      - name: Set matrix for Python versions
        id: set-matrix
        run: echo "versions=['3.10','3.11','3.12','3.13','3.14']" >> $GITHUB_OUTPUT

  # Job 2: Install & Cache Dependencies
  setup-dependencies:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci

      - name: Synchronize Python Workspace
        run: uv sync --all-extras

      - name: Verify SDK Buildability
        run: uv run --package congine-sdk python -c "import congine_core; print(f'✅ SDK importable')"

  # Job 3: Code Quality & Formatting
  format-check:
    name: Format & Linting Check
    runs-on: ubuntu-latest
    needs: setup-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore Dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Check Code Formatting (Prettier)
        run: npx prettier --check . --ignore-path .prettierignore

      - name: Check Python Formatting (Ruff)
        run: uv run --package congine-sdk ruff format --check libs/congine-sdk

      - name: Check Python Imports (Ruff)
        run: uv run --package congine-sdk ruff check libs/congine-sdk --select F,E902

  # Job 4: TypeScript Type Safety
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: setup-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc --noEmit

      - name: Verify Nx TypeScript References
        run: npx nx sync:check

  # Job 5: Python Static Analysis (Multi-version)
  python-lint:
    name: Python Lint (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: setup-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.validate.outputs.python-versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Restore Dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run Ruff Lint (All Rules)
        run: uv run --package congine-sdk ruff check libs/congine-sdk

      - name: Run Mypy Type Checking
        run: uv run --package congine-sdk mypy libs/congine-sdk || true

  # Job 6: Python Unit & Integration Tests (Multi-version)
  python-test:
    name: Python Tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: setup-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.validate.outputs.python-versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Restore Dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Run Test Suite with Coverage
        run: |
          uv run --package congine-sdk pytest \
            libs/congine-sdk/tests \
            --cov=congine_core \
            --cov-report=term-summary \
            --cov-report=xml \
            --cov-report=html \
            -v

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
            htmlcov/
          retention-days: 30

  # Job 7: Build & Package Distribution
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: setup-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore Dependencies
        run: |
          npm ci
          uv sync --all-extras

      - name: Build SDK Distribution
        run: |
          uv pip install build
          uv run --package congine-sdk python -m build libs/congine-sdk
          ls -lah libs/congine-sdk/dist/

      - name: Validate Distribution Integrity
        run: |
          uv pip install twine
          twine check libs/congine-sdk/dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            libs/congine-sdk/dist/
          retention-days: 7

  # Job 8: Security & Dependency Analysis
  security:
    name: Security & Dependency Checks
    runs-on: ubuntu-latest
    needs: setup-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Python Dependencies (Safety)
        run: |
          uv pip install safety
          uv pip freeze | safety check --stdin || echo "⚠️ Vulnerabilities detected — review before deploying"

      - name: Audit NPM Dependencies
        run: npm audit --audit-level=moderate || echo "⚠️ Vulnerabilities detected — review before deploying"

  # Job 9: Coverage Aggregation & Reporting
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: python-test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Coverage Reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-py*
          merge-multiple: true

      - name: Display Coverage Summary
        run: |
          echo "📊 Code Coverage Summary"
          echo "========================"
          if [ -f coverage.xml ]; then
            echo "✅ Coverage reports collected successfully"
            python -c "
            import xml.etree.ElementTree as ET
            tree = ET.parse('coverage.xml')
            root = tree.getroot()
            line_rate = root.get('line-rate', 'N/A')
            branch_rate = root.get('branch-rate', 'N/A')
            print(f'Line Coverage: {float(line_rate)*100:.1f}%' if line_rate != 'N/A' else 'Line Coverage: N/A')
            print(f'Branch Coverage: {float(branch_rate)*100:.1f}%' if branch_rate != 'N/A' else 'Branch Coverage: N/A')
            " || echo "Coverage data available in artifacts"
          else
            echo "⚠️ No coverage reports found"
          fi

  # Job 10: Pipeline Status Consensus
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs:
      [
        validate,
        setup-dependencies,
        format-check,
        typecheck,
        python-lint,
        python-test,
        build,
        security,
        coverage-report,
      ]
    if: always()
    steps:
      - name: Evaluate Pipeline Results
        run: |
          echo "🔍 Pipeline Status Report"
          echo "========================="
          echo "Validation         : ${{ needs.validate.result }}"
          echo "Dependencies Setup : ${{ needs.setup-dependencies.result }}"
          echo "Format & Lint      : ${{ needs.format-check.result }}"
          echo "TypeScript Check   : ${{ needs.typecheck.result }}"
          echo "Python Lint        : ${{ needs.python-lint.result }}"
          echo "Python Tests       : ${{ needs.python-test.result }}"
          echo "Build              : ${{ needs.build.result }}"
          echo "Security           : ${{ needs.security.result }}"
          echo "Coverage Report    : ${{ needs.coverage-report.result }}"
          echo "========================="

      - name: Assert Pipeline Compliance
        run: |
          if [[ "${{ needs.format-check.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.python-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.python-test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Pipeline FAILED: Core quality gates not met"
            exit 1
          fi
          echo "✅ Pipeline PASSED: All quality gates satisfied"
