name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'
  NX_CLOUD_DISTRIBUTED_EXECUTION: true
  NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT: 3

jobs:
  # Job 1: Environment Sanity Verification
  setup:
    name: Setup & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Runtime Environment
        run: |
          echo "🚀 Node version: $(node --version)"
          echo "📦 NPM version: $(npm --version)"
          echo "🐍 Python version: $(python --version)"
          echo "⚡ UV version: $(uv --version)"

  # Job 2: Install Workspace Dependencies (Populates Global Shared Cache)
  install-dependencies:
    name: Warm Caches
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node Packages
        run: npm ci

      - name: Synchronize Python Workspace
        run: uv sync --all-extras

  # Job 3: Monorepo Code Style Verification
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore Project Environments
        run: |
          npm ci
          uv sync --all-extras

      - name: Execute Code Formatting Scopes
        run: npx nx record -- npx nx format:check --base="remotes/origin/main" || npx nx record -- npx nx format:check

  # Job 4: Parallel Linting Matrix (Validates Python Floor >= 3.10)
  lint:
    name: Lint (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Synchronize Virtual Environments
        run: |
          npm ci
          uv sync --all-extras

      - name: Run Workspace Static Code Analysis
        run: npx nx record -- npx nx run-many -t lint --base="remotes/origin/main" || npx nx record -- npx nx run-many -t lint

  # Job 5: Parallel Type Constraints Matrix (Ensures Strict Type-Safety Lockdown)
  typecheck:
    name: Type Check (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Synchronize Virtual Environments
        run: |
          npm ci
          uv sync --all-extras

      - name: Run Strict Mypy Verification Scopes
        run: npx nx record -- npx nx run-many -t typecheck --base="remotes/origin/main" || npx nx record -- npx nx run-many -t typecheck

  # Job 6: Parallel Adversarial & Unit Execution Matrix
  test:
    name: Test (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Synchronize Virtual Environments
        run: |
          npm ci
          uv sync --all-extras

      - name: Run Test Suites
        run: npx nx record -- npx nx run-many -t test --base="remotes/origin/main" || npx nx record -- npx nx run-many -t test

      - name: Secure Coverage Footprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-py${{ matrix.python-version }}
          path: |
            coverage/
            .coverage
          retention-days: 30

  # Job 7: Production Compilation Step
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Synchronize Virtual Environments
        run: |
          npm ci
          uv sync --all-extras

      - name: Compile Workspace Target Targets
        run: npx nx record -- npx nx run-many -t build --base="remotes/origin/main" || npx nx record -- npx nx run-many -t build

      - name: Secure Production Distribution Targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            build/
          retention-days: 7

  # Job 8: End-to-End Test Engine Boundary
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Synchronize Virtual Environments
        run: |
          npm ci
          uv sync --all-extras

      - name: Execute System E2E Scopes
        run: npx nx record -- npx nx run-many -t e2e-ci --base="remotes/origin/main" || npx nx record -- npx nx run-many -t e2e-ci || echo "No E2E targets configured"

  # Job 9: TypeScript Module Seam Integrity Check
  sync-typescript-refs:
    name: Sync TypeScript References
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Structural Dependencies
        run: npm ci

      - name: Assert Nx Inter-Project Boundary Sync
        run: npx nx sync:check

  # Job 10: Aggregated Coverage Reporting
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-reports-py*
          merge-multiple: true

      - name: Display coverage summary
        run: |
          echo "📊 Code Coverage Summary"
          if [ -f .coverage ]; then
            echo "Coverage target mapping resolved successfully."
          else
            echo "No operational coverage footprints found."
          fi

  # Job 11: Self-Healing Automation Pipeline Remediation Gate
  self-healing-ci:
    name: Self-Healing CI
    runs-on: ubuntu-latest
    needs: [format-check, lint, typecheck, test, build]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Synchronize Environments
        run: |
          npm ci
          uv sync --all-extras

      - name: Attempt Automatic Target Repair Protocols
        run: npx nx fix-ci || true
        continue-on-error: true

  # Job 12: Pipeline Determinism & Enforcement Consensus Target
  ci-status:
    name: CI Status Consensus
    runs-on: ubuntu-latest
    needs: [setup, install-dependencies, format-check, lint, typecheck, test, build, sync-typescript-refs, coverage, self-healing-ci]
    if: always()
    steps:
      - name: Compile Pipeline Matrix Status Reports
        run: |
          echo "🔍 Congine Architecture Pipeline Status Evaluation"
          echo "=================================================="
          echo "Core Setup Status       : ${{ needs.setup.result }}"
          echo "Dependency Cache Seeding : ${{ needs.install-dependencies.result }}"
          echo "Format Interoperability : ${{ needs.format-check.result }}"
          echo "Lint Enforcement Engine : ${{ needs.lint.result }}"
          echo "Strict Type Isolation   : ${{ needs.typecheck.result }}"
          echo "Adversarial Test Matrices: ${{ needs.test.result }}"
          echo "System Build Targets    : ${{ needs.build.result }}"
          echo "TypeScript Module Bounds: ${{ needs.sync-typescript-refs.result }}"
          echo "Coverage Footprints     : ${{ needs.coverage.result }}"
          echo "Self-Healing State Hooks: ${{ needs.self-healing-ci.result }}"
          echo "=================================================="

      - name: Assert Pipeline Compliance
        run: |
          if [[ "${{ needs.format-check.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Pipeline Consensus FAILED: Architectural Violations Encountered."
            exit 1
          else
            echo "✅ Pipeline Consensus PASSED: Phase 0 Steel-Thread Constraints Satisfied."
          fi