[project]
name = "congine-sdk"
version = "0.1.0"
description = "Core validation engine for AMCE — contract-driven governance for LLM outputs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Congine" },
]
keywords = ["llm", "validation", "contracts", "governance", "ai", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "google-re2>=1.0",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "portalocker>=2.8",
    # Direct, not incidental. CONGINE constructs an explicit no-retrieval
    # `Registry` so semantic evaluation can never fetch an external `$ref`:
    # left to itself the library performs a real network request and lets the
    # remote document decide enforcement (P1.5-A0-2). `jsonschema` does not
    # re-export `Registry`, so the supported API is only reachable by importing
    # `referencing` directly. It is already in the graph transitively via
    # `jsonschema`; the floor matches jsonschema's own (`>=0.28.4`), verified by
    # installing that exact version and confirming both `Registry(retrieve=...)`
    # and `NoSuchResource(ref=...)` exist there.
    "referencing>=0.28.4",
]

[project.urls]
Homepage = "https://github.com/congine/congine"
Repository = "https://github.com/congine/congine"
Documentation = "https://github.com/congine/congine/tree/main/libs/congine-sdk#readme"
Changelog = "https://github.com/congine/congine/blob/main/libs/congine-sdk/CHANGELOG.md"
Issues = "https://github.com/congine/congine/issues"

[project.optional-dependencies]
# Optional LangChain integration. Core SDK stays langchain-free; install with
# `pip install congine-sdk[langchain]` to use CongineCallbackHandler.
langchain = ["langchain-core>=0.3,<0.4"]
# Optional math extension for the KS drift engine. Core SDK does not require
# numpy; install with `pip install congine-sdk[stats]` to use KSDriftEngine.detect.
stats = ["numpy>=1.26"]
# Backward-compatible alias: google-re2 is now a required core dependency (FIX-02).
redos = ["google-re2>=1.0"]
# Development / test toolchain. NOT shipped to runtime consumers; install with
# `pip install congine-sdk[dev]` (or `uv sync --extra dev`).
dev = [
    "mypy>=1.18.2",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.15",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = true




[tool.ruff]
# Pin the target version to the supported floor (`requires-python = ">=3.11"`)
# so format/check do not rewrite newer-only syntax (e.g. PEP 758 unparenthesised
# `except A, B:`) that would break collection on 3.11-3.13.
#
# The floor is 3.11 in exactly four places and they must agree (audit Q6):
# `requires-python` above, the classifiers above, this target-version, and the
# CI matrix. They previously disagreed four ways.
target-version = "py311"
extend-exclude = ["src/congine_sdk.egg-info"]

[tool.mypy]
# Static enforcement covers production source only. Tests and examples exercise
# intentionally dynamic integration seams and are checked by their runtime suites.
files = ["src/congine_core"]
python_version = "3.11"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["congine_core"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
